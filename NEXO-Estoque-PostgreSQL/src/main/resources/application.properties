spring.application.name=nexo-estoque

# O projeto usa a porta 8081 porque a porta 8080 ja estava ocupada no computador.
server.port=8081

# Conexao com PostgreSQL.
# Se o PostgreSQL estiver em outra porta, altere 5432 para a porta exibida no pgAdmin.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Nexo_estoque}
spring.datasource.username=postgres
# IMPORTANTE: substitua postgres pela senha definida na instalacao do PostgreSQL.
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria/atualiza as TABELAS dentro do banco nexo_estoque.
# O banco em si precisa ser criado uma vez pelo pgAdmin usando database/criar_banco.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
